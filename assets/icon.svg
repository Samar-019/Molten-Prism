<svg width="1024" height="1024" viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Outer ambient glow filter -->
    <filter id="prism-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="star-sparkle" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Gradients -->
    <radialGradient id="space-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B5CFF" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#00D2FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Outer Neon Ring Gradient -->
    <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#6B73FF" />
      <stop offset="80%" stop-color="#D800E6" />
      <stop offset="100%" stop-color="#FF2A85" />
    </linearGradient>

    <!-- Glass Sphere Gradient -->
    <radialGradient id="sphere-core" cx="42%" cy="38%" r="62%">
      <stop offset="0%" stop-color="#AEE7FF" />
      <stop offset="25%" stop-color="#6292FF" />
      <stop offset="60%" stop-color="#843BFF" />
      <stop offset="85%" stop-color="#D638B3" />
      <stop offset="100%" stop-color="#220B4D" />
    </radialGradient>

    <!-- Specular Highlight for Liquid Glass effect -->
    <linearGradient id="glass-specular" x1="20%" y1="0%" x2="65%" y2="80%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.88" />
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="70%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="crescent-arc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#9C27B0" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#E91E63" stop-opacity="0.95" />
    </linearGradient>

    <!-- CSS Keyframe Animations -->
    <style>
      @keyframes molten-pulse {
        0%, 100% {
          transform: scale(1);
          filter: drop-shadow(0 0 35px rgba(138, 75, 255, 0.45));
        }
        50% {
          transform: scale(1.035);
          filter: drop-shadow(0 0 65px rgba(0, 229, 255, 0.75));
        }
      }

      @keyframes molten-spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      @keyframes star-twinkle {
        0%, 100% {
          opacity: 0.9;
          transform: scale(1) rotate(0deg);
        }
        50% {
          opacity: 1;
          transform: scale(1.22) rotate(18deg);
        }
      }

      @keyframes orbital-float {
        0% {
          transform: rotate(0deg) translateY(0px);
        }
        50% {
          transform: rotate(180deg) translateY(8px);
        }
        100% {
          transform: rotate(360deg) translateY(0px);
        }
      }

      .animated-pulse-group {
        transform-origin: 512px 512px;
        animation: molten-pulse 4s ease-in-out infinite;
      }

      .animated-spin-ring {
        transform-origin: 512px 512px;
        animation: molten-spin 14s linear infinite;
      }

      .animated-star {
        transform-origin: 512px 512px;
        animation: star-twinkle 2.4s ease-in-out infinite;
      }

      .animated-orbitals {
        transform-origin: 512px 512px;
        animation: orbital-float 9s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Ambient Glow Backdrop -->
  <circle cx="512" cy="512" r="500" fill="url(#space-ambient)" />

  <g class="animated-pulse-group">
    <!-- Outer Neon Glowing Orbit Ring -->
    <g class="animated-spin-ring" filter="url(#prism-glow)">
      <circle cx="512" cy="512" r="395" stroke="url(#ring-gradient)" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="1900 240" opacity="0.88"/>
      <!-- Soft Outer Accent Orbit -->
      <circle cx="512" cy="512" r="440" stroke="#7B5CFF" stroke-width="4" fill="none" opacity="0.32" stroke-dasharray="28 140"/>
    </g>

    <!-- Liquid Glass Crescent Wave Ring -->
    <path d="M 230 460 C 230 295, 370 160, 535 160 C 685 160, 790 270, 785 410 C 780 470, 735 480, 715 440 C 695 330, 610 245, 505 245 C 380 245, 290 340, 290 480 C 290 590, 370 680, 480 705 C 530 715, 520 745, 470 745 C 330 745, 230 615, 230 460 Z"
          fill="url(#crescent-arc)" opacity="0.85" filter="url(#prism-glow)"/>

    <!-- Central Liquid Glass Orb -->
    <g filter="url(#prism-glow)">
      <!-- Base Core Sphere -->
      <circle cx="512" cy="512" r="280" fill="url(#sphere-core)" />

      <!-- Inner Shadow Depth -->
      <circle cx="512" cy="512" r="280" fill="black" opacity="0.16" />

      <!-- Smooth Inner Crescent Shading -->
      <path d="M 260 520 C 270 650, 380 760, 520 760 C 650 760, 755 660, 770 540 C 730 630, 630 700, 510 700 C 370 700, 280 610, 260 520 Z"
            fill="#00F0FF" opacity="0.75" />

      <!-- Liquid Glass Curvature Specular Reflection -->
      <path d="M 310 390 C 330 280, 440 240, 570 240 C 660 240, 705 270, 670 300 C 600 300, 480 320, 390 395 C 350 430, 300 440, 310 390 Z"
            fill="url(#glass-specular)" />
    </g>

    <!-- Star Particles & Orbiting Cosmic Dots -->
    <g class="animated-orbitals">
      <!-- Orbiting cyan particle -->
      <circle cx="210" cy="340" r="14" fill="#00E5FF" filter="url(#prism-glow)" />
      <!-- Orbiting pink bead -->
      <circle cx="830" cy="380" r="16" fill="#FF2A85" filter="url(#prism-glow)" />
      <!-- Floating purple particle -->
      <circle cx="780" cy="720" r="12" fill="#BA68C8" filter="url(#prism-glow)" />
      <!-- Teal trailing comet -->
      <circle cx="280" cy="800" r="18" fill="#00F5D4" filter="url(#prism-glow)" />
      <path d="M 280 800 Q 320 780, 370 760" stroke="#00F5D4" stroke-width="4" stroke-linecap="round" opacity="0.6" />
      <circle cx="810" cy="815" r="14" fill="#FF5252" filter="url(#prism-glow)" />
    </g>

    <!-- Central Diamond Star Flare -->
    <g class="animated-star" filter="url(#star-sparkle)">
      <!-- Main Star 4-point flare -->
      <path d="M 512 400 Q 512 512, 624 512 Q 512 512, 512 624 Q 512 512, 400 512 Q 512 512, 512 400 Z"
            fill="#FFFFFF" />
      <!-- Diagonal subtle rays -->
      <path d="M 512 445 Q 512 512, 579 512 Q 512 512, 512 579 Q 512 512, 445 512 Q 512 512, 512 445 Z"
            fill="#FFFFFF" opacity="0.65" transform="rotate(45 512 512)" />
      <!-- Star center bright core -->
      <circle cx="512" cy="512" r="18" fill="#FFFFFF" />
    </g>
  </g>
</svg>